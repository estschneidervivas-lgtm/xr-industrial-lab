<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XR Industrial Lab - UMNG</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #ECECEC">

      <!-- ============ ASSETS ============ -->
      <!-- Coloca aquí tu archivo .glb exportado desde Blender.
           Debe existir la carpeta /models con el archivo modelo.glb -->
      <a-assets>
        <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
      </a-assets>

      <!-- ============ PISO Y CIELO ============ -->
      <a-plane rotation="-90 0 0" width="20" height="20" color="#B0B0B0" shadow></a-plane>
      <a-sky color="#DDEEFF"></a-sky>

      <!-- ============ CELDA DE MANUFACTURA (primitivas - Parte C) ============ -->
      <a-entity id="celda-manufactura" position="0 0 -6">
        <a-entity id="tanque" position="-4 0 0">
          <a-cylinder position="0 1 0" radius="0.8" height="2" color="#3A86FF"></a-cylinder>
          <a-cylinder position="0 2.05 0" radius="0.85" height="0.1" color="#023E8A"></a-cylinder>
          <a-text value="TANQUE" position="0 2.6 0" align="center" color="#000" width="4"></a-text>
        </a-entity>

        <a-entity id="banda" position="0 0 0">
          <a-box position="0 0.4 0" width="6" height="0.2" depth="1" color="#495057"></a-box>
          <a-cylinder position="-3 0.4 0" radius="0.25" height="1.1" rotation="0 0 90" color="#FFC65D"></a-cylinder>
          <a-cylinder position="3 0.4 0" radius="0.25" height="1.1" rotation="0 0 90" color="#FFC65D"></a-cylinder>
          <a-box position="-3 0.65 0" width="0.4" height="0.4" depth="0.4" color="#EF2D5E"
                 animation="property: position; from: -3 0.65 0; to: 3 0.65 0; dur: 4000; loop: true; easing: linear">
          </a-box>
          <a-text value="BANDA TRANSPORTADORA" position="0 1.1 0" align="center" color="#000" width="6"></a-text>
        </a-entity>

        <a-entity id="robot" position="4 0 0">
          <a-cylinder position="0 0.2 0" radius="0.5" height="0.4" color="#212529"></a-cylinder>
          <a-cylinder position="0 1 0" radius="0.2" height="1.2" color="#6C757D"></a-cylinder>
          <a-box position="0.6 1.6 0" width="1.2" height="0.2" depth="0.2" color="#4CC3D9"
                 rotation="0 0 20"
                 animation="property: rotation; from: 0 0 20; to: 0 0 -20; dur: 2500; dir: alternate; loop: true">
          </a-box>
          <a-sphere position="1.1 1.35 0" radius="0.12" color="#F72585"></a-sphere>
          <a-text value="BRAZO ROBOTICO" position="0 2.1 0" align="center" color="#000" width="6"></a-text>
        </a-entity>
      </a-entity>

      <!-- ============ MODELO CAD IMPORTADO (Parte D) ============ -->
      <!-- Ajusta position/scale/rotation según el tamaño real de tu ensamblaje -->
      <a-entity
        gltf-model="#modeloIndustrial"
        position="0 0 -2"
        scale="1 1 1"
        rotation="0 0 0">
      </a-entity>

      <!-- ============ CÁMARA / RIG (desktop, móvil, VR, AR) ============ -->
      <a-entity id="rig" position="0 1.6 0" movement-controls>
        <a-camera look-controls wasd-controls>
          <a-cursor color="#FAFAFA"></a-cursor>
        </a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
